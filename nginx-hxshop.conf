server {
    listen 80;
    server_name shop.hxdev.ir;          # ← ساب‌دامین خودتان

    client_max_body_size 80m;           # آپلود عکس محصولات
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

    location /fonts/ { alias /var/www/hxshop/public/fonts/; expires 365d; add_header Cache-Control "public, immutable"; }
    location /demo/  { alias /var/www/hxshop/public/demo/;  expires 7d; }
    location /uploads/ { alias /var/www/hxshop/uploads/; expires 30d; }
    location / {
        proxy_pass http://127.0.0.1:3001;   # پورت ۳۰۰۱؛ سایت اصلی روی ۳۰۰۰ است
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
